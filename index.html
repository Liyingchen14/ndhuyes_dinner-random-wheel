<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>晚餐轉盤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面：左邊轉盤、右邊篩選與結果；手機直向堆疊。燈籠紅為唯一強調色，轉盤分段用夜市攤位招牌的八種色。 */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --fg:#1b1f2e; --muted:#5b6275; --line:#dde0ea;
  --accent:#d2402b; --accent-fg:#ffffff; --chip:#eceef5; --chip-on:#1b1f2e; --chip-on-fg:#ffffff;
  --pointer:#1b1f2e; --hub:#ffffff; --rim:#1b1f2e;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131f; --surface:#1c1e2e; --fg:#eef0f8; --muted:#a2a8bd; --line:#2e3147;
  --accent:#ef5a43; --accent-fg:#ffffff; --chip:#2a2d42; --chip-on:#eef0f8; --chip-on-fg:#12131f;
  --pointer:#eef0f8; --hub:#1c1e2e; --rim:#eef0f8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131f; --surface:#1c1e2e; --fg:#eef0f8; --muted:#a2a8bd; --line:#2e3147;
  --accent:#ef5a43; --accent-fg:#ffffff; --chip:#2a2d42; --chip-on:#eef0f8; --chip-on-fg:#12131f;
  --pointer:#eef0f8; --hub:#1c1e2e; --rim:#eef0f8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1020px;margin:0 auto}
header{margin-bottom:20px}
h1{font-size:clamp(26px,5vw,36px);font-weight:900;letter-spacing:.02em;line-height:1.2}
header p{color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.stagelabel{text-align:center;font-weight:900;font-size:20px;min-height:32px;margin-bottom:8px;color:var(--accent)}
.stage{position:relative;width:min(100%,480px);margin:0 auto;aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;
  border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid var(--pointer);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:23%;aspect-ratio:1;border-radius:50%;border:0;
  background:var(--accent);color:var(--accent-fg);font:900 clamp(18px,4.4vw,26px)/1 var(--font);cursor:pointer;z-index:3;
  box-shadow:0 0 0 6px var(--hub),0 6px 16px rgba(0,0,0,.28)}
.spin:disabled{opacity:.6;cursor:default}
.spin:focus-visible,.chip:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel+.panel{margin-top:16px}
.label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--chip);color:var(--fg);padding:8px 14px;border-radius:999px;font:500 15px var(--font);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:16px}
.row>*{min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
.price-line{display:flex;justify-content:space-between;align-items:baseline}
.price-line b{font-size:20px;font-variant-numeric:tabular-nums}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:16px var(--font)}
.field{margin-top:16px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.result{min-height:150px}
.result .tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.result h2{font-size:clamp(24px,5vw,32px);font-weight:900;line-height:1.25;margin:10px 0 4px;overflow-wrap:anywhere}
.result .meta{color:var(--muted)}
.result .price{font-size:30px;font-weight:900;color:var(--accent);margin-top:8px;font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column;gap:10px;margin:10px 0 4px}
.rows .r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px}
.rows .r b{overflow-wrap:anywhere}
.rows .r small{display:block;color:var(--muted);font-size:13px}
.rows .r .p{font-variant-numeric:tabular-nums;font-weight:700}
.result .empty{color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 16px;border-radius:10px;font:700 15px var(--font);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.hist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;justify-content:space-between;gap:12px;font-size:15px;border-bottom:1px solid var(--line);padding-bottom:6px}
.hist li span:first-child{overflow-wrap:anywhere}
.hist li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.foot{color:var(--muted);font-size:13px;margin-top:24px}
</style>
<div class="wrap">
  <header>
    <h1>今晚吃什麼？轉盤決定</h1>
    <p>東華夜市 <span id="stores">53</span> 家攤位、<span id="total">618</span> 個品項，選好條件就轉。</p>
  </header>
  <div class="grid">
    <section>
      <div class="stagelabel" id="stageLabel">&nbsp;</div>
      <div class="stage">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" width="960" height="960" role="img" aria-label="晚餐轉盤"></canvas>
        <button class="spin" id="spin" type="button">轉！</button>
      </div>
      <div class="btns" style="justify-content:center">
        <button class="btn" id="reshuffle" type="button">換一批選項</button>
      </div>
    </section>
    <section>
      <div class="panel result" id="result" aria-live="polite">
        <span class="label">結果</span>
        <p class="empty">按中間的「轉！」開始。</p>
      </div>
      <div class="panel">
        <span class="label">轉什麼</span>
        <div class="chips" id="modes">
          <button class="chip" type="button" data-mode="single" aria-pressed="true">單品</button>
          <button class="chip" type="button" data-mode="set" aria-pressed="false">套餐（主餐＋小吃＋飲料）</button>
        </div>
        <div id="singleOpts">
        <span class="label" style="margin-top:16px">想吃哪一類</span>
        <div class="chips" id="groups">
          <button class="chip" type="button" data-g="main" aria-pressed="true">主餐</button>
          <button class="chip" type="button" data-g="side" aria-pressed="true">小吃</button>
          <button class="chip" type="button" data-g="dessert" aria-pressed="true">甜點</button>
          <button class="chip" type="button" data-g="drink" aria-pressed="true">飲料</button>
        </div>
        <div class="field">
          <div class="price-line"><label class="label" for="price" style="margin:0">單品價格上限</label><b id="priceOut">150 元</b></div>
          <input id="price" type="range" min="30" max="300" step="10" value="150">
        </div>
        </div>
        <div id="setOpts" class="field" hidden>
          <div class="price-line"><label class="label" for="budget" style="margin:0">套餐預算上限</label><b id="budgetOut">200 元</b></div>
          <input id="budget" type="range" min="100" max="400" step="10" value="200">
          <p class="hint">一份套餐 = 1 個主餐 + 1 個小吃或甜點 + 1 杯飲料，三樣來自不同攤位，總價不超過預算。</p>
        </div>
        <div class="field">
          <label class="label" for="avoid">不要出現（用逗號分開）</label>
          <input id="avoid" type="text" placeholder="例如：牛, 蝦, 辣" autocomplete="off">
          <p class="hint" id="count"></p>
        </div>
      </div>
      <div class="panel">
        <span class="label">最近轉到</span>
        <ul class="hist" id="hist"><li><span style="color:var(--muted)">還沒有紀錄</span><span></span></li></ul>
      </div>
    </section>
  </div>
  <p class="foot">價格以現場為準。</p>
  <p class="foot" id="admin" hidden>菜單來源：<span id="src">內建菜單</span><br><label class="btn" style="display:inline-block;cursor:pointer">換成其他菜單檔（.csv）<input id="csvFile" type="file" accept=".csv,text/csv" hidden></label></p>
</div>

let MENU = EMBEDDED;
const GROUP_LABEL = {main:"主餐", side:"小吃", dessert:"甜點", drink:"飲料"};
const COLORS = ["#d2402b","#e98a15","#e2b714","#4aa35a","#2a9d8f","#3d7fd1","#7b5ec7","#c2468f"];
const DARK_TEXT = new Set(["#e2b714","#e98a15"]);
const SEGMENTS = 8;

const $ = id => document.getElementById(id);
const canvas = $("wheel"), ctx = canvas.getContext("2d");
const state = {mode:"single", groups:new Set(["main","side","dessert","drink"]), max:150, budget:200, avoid:[], slice:[], rot:0, busy:false, history:[]};
$("total").textContent = MENU.length;

function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const okAvoid = m => !state.avoid.some(a => (m[3]+m[2]).toLowerCase().includes(a));

function pool(){
  const cap = state.mode==="set" ? state.budget : state.max;
  const gs = state.mode==="set" ? new Set(["main","side","dessert","drink"]) : state.groups;
  return MENU.filter(m => gs.has(m[0]) && m[4] <= cap && okAvoid(m));
}

function diverse(p, n){
  const out=[], used=new Set();
  for(const m of p){ if(out.length>=n) break; if(!used.has(m[1])){ out.push(m); used.add(m[1]); } }
  for(const m of p){ if(out.length>=n) break; if(!out.includes(m)) out.push(m); }
  return out;
}

function pickSlice(){
  const p = pool();
  state.slice = diverse(shuffle(p), SEGMENTS);
  $("count").textContent = "符合條件 " + p.length + " 個品項" + (p.length ? "，轉盤上放 " + state.slice.length + " 個。" : "，請放寬條件。");
  $("stageLabel").innerHTML = "&nbsp;";
  draw();
}

function short(s,n){ const a=[...s]; return a.length>n ? a.slice(0,n-1).join("")+"…" : s; }

function draw(){
  const W=canvas.width, C=W/2, R=C-22;
  ctx.clearRect(0,0,W,W);
  const n = state.slice.length;
  if(!n){
    ctx.fillStyle = cssVar("--chip"); ctx.beginPath(); ctx.arc(C,C,R,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = cssVar("--muted"); ctx.font = "700 40px "+cssVar("--font"); ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("沒有符合的品項", C, C-110); return;
  }
  const seg = Math.PI*2/n;
  ctx.save(); ctx.translate(C,C); ctx.rotate(state.rot);
  for(let i=0;i<n;i++){
    const a0 = -Math.PI/2 + i*seg, a1 = a0+seg, col = COLORS[i%COLORS.length];
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,a0,a1); ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = cssVar("--surface"); ctx.lineWidth = 4; ctx.stroke();
    ctx.save(); ctx.rotate(a0+seg/2); ctx.textAlign="right"; ctx.textBaseline="middle";
    ctx.fillStyle = DARK_TEXT.has(col) ? "#1b1f2e" : "#ffffff";
    ctx.font = "700 38px "+cssVar("--font");
    ctx.fillText(short(state.slice[i][3].replace(/\s*[A-Z][A-Z ]{3,}$/,""), 7), R-30, 0);
    ctx.restore();
  }
  ctx.restore();
  ctx.lineWidth = 12; ctx.strokeStyle = cssVar("--rim"); ctx.beginPath(); ctx.arc(C,C,R,0,Math.PI*2); ctx.stroke();
}

const ease = t => 1 - Math.pow(1-t, 4);
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

function spinTo(idx, dur){
  return new Promise(resolve => {
    const n = state.slice.length, seg = Math.PI*2/n;
    const mid = idx*seg + seg/2, jitter = (Math.random()-.5)*seg*.7;
    const cur = ((state.rot % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
    let delta = ((-(mid+jitter)) - cur) % (Math.PI*2); if(delta<0) delta += Math.PI*2;
    const r = reduce();
    const total = delta + Math.PI*2*(r ? 1 : 4), start = state.rot, d = r ? 600 : dur, t0 = performance.now();
    (function step(now){
      const t = Math.min(1,(now-t0)/d);
      state.rot = start + total*ease(t); draw();
      if(t<1) requestAnimationFrame(step); else resolve();
    })(t0);
  });
}

function remember(text, price){
  state.history.unshift([text, price]); state.history = state.history.slice(0,6);
  $("hist").innerHTML = "";
  state.history.forEach(h => {
    const li=document.createElement("li"), a=document.createElement("span"), b=document.createElement("span");
    a.textContent = h[0]; b.textContent = h[1] + " 元"; li.append(a,b); $("hist").append(li);
  });
}

function showSingle(m){
  $("result").innerHTML = '<span class="label">結果</span><span class="tag">'+GROUP_LABEL[m[0]]+'</span>'+
    '<h2></h2><div class="meta"></div><div class="price">'+m[4]+' 元</div>'+
    '<div class="btns"><button class="btn primary" id="again" type="button">再轉一次</button></div>';
  $("result").querySelector("h2").textContent = m[3];
  $("result").querySelector(".meta").textContent = "店家" + m[1] + "｜" + m[2];
  $("again").addEventListener("click", run);
  remember(m[3] + "（" + m[2] + "）", m[4]);
}

function showSet(combo){
  const total = combo.reduce((s,m)=>s+m[4],0);
  const box = $("result");
  box.innerHTML = '<span class="label">今晚的套餐</span><div class="rows"></div>'+
    '<div class="price" id="sum"></div><div class="btns"><button class="btn primary" id="again" type="button">再轉一份套餐</button></div>';
  const rows = box.querySelector(".rows");
  combo.forEach(m => {
    const r=document.createElement("div"); r.className="r";
    const t=document.createElement("span"); t.className="tag"; t.textContent=GROUP_LABEL[m[0]];
    const mid=document.createElement("div"), b=document.createElement("b"), s=document.createElement("small");
    b.textContent=m[3]; s.textContent="店家"+m[1]+"｜"+m[2]; mid.append(b,s);
    const p=document.createElement("span"); p.className="p"; p.textContent=m[4]+" 元";
    r.append(t,mid,p); rows.append(r);
  });
  $("sum").textContent = "合計 " + total + " 元（預算 " + state.budget + " 元內）";
  $("again").addEventListener("click", run);
  remember("套餐：" + combo.map(m=>short(m[3].replace(/\s*[A-Z][A-Z ]{3,}$/,""),6)).join(" ＋ "), total);
}

function buildCombo(){
  const base = MENU.filter(m => m[4] <= state.budget && okAvoid(m));
  const slots = [
    base.filter(m => m[0]==="main"),
    base.filter(m => m[0]==="side" || m[0]==="dessert"),
    base.filter(m => m[0]==="drink")
  ];
  if(slots.some(s => !s.length)) return null;
  const found=[];
  for(let t=0;t<4000 && found.length<60;t++){
    const c = slots.map(s => s[Math.floor(Math.random()*s.length)]);
    if(new Set(c.map(m=>m[1])).size<3) continue;
    const sum = c.reduce((a,m)=>a+m[4],0);
    if(sum<=state.budget) found.push({c,sum});
  }
  if(!found.length) return null;
  const good = found.filter(f => f.sum >= state.budget*0.75);
  const chosen = good.length ? good[Math.floor(Math.random()*good.length)] : found.sort((a,b)=>b.sum-a.sum)[0];
  return {combo: chosen.c, slots};
}

async function runSet(){
  const r = buildCombo();
  if(!r){
    $("result").innerHTML = '<span class="label">結果</span><p class="empty">這個預算湊不出套餐，請調高預算或減少「不要出現」的字。</p>';
    return;
  }
  const names = ["第 1 轉：主餐","第 2 轉：小吃或甜點","第 3 轉：飲料"];
  $("result").innerHTML = '<span class="label">結果</span><p class="empty">轉盤進行中…</p>';
  for(let i=0;i<3;i++){
    const pick = r.combo[i];
    const others = diverse(shuffle(r.slots[i].filter(m => m!==pick)), SEGMENTS-1);
    const arr = shuffle(others.concat([pick]));
    state.slice = arr; $("stageLabel").textContent = names[i]; draw();
    await spinTo(arr.indexOf(pick), 2800);
    await new Promise(res => setTimeout(res, reduce() ? 100 : 450));
  }
  $("stageLabel").textContent = "套餐完成！";
  showSet(r.combo);
}

async function run(){
  if(state.busy) return;
  state.busy = true; $("spin").disabled = true;
  try{
    if(state.mode==="set") await runSet();
    else if(state.slice.length){
      const idx = Math.floor(Math.random()*state.slice.length);
      await spinTo(idx, 4600); showSingle(state.slice[idx]);
    }
  } finally { state.busy=false; $("spin").disabled=false; }
}

function refresh(){ if(!state.busy) pickSlice(); }
$("spin").addEventListener("click", run);
$("reshuffle").addEventListener("click", refresh);
document.querySelectorAll("#modes .chip").forEach(b => b.addEventListener("click", () => {
  if(state.busy) return;
  state.mode = b.dataset.mode;
  document.querySelectorAll("#modes .chip").forEach(x => x.setAttribute("aria-pressed", String(x===b)));
  $("singleOpts").hidden = state.mode==="set"; $("setOpts").hidden = state.mode!=="set";
  $("result").innerHTML = '<span class="label">結果</span><p class="empty">按中間的「轉！」開始。</p>';
  pickSlice();
}));
document.querySelectorAll("#groups .chip").forEach(b => b.addEventListener("click", () => {
  const g=b.dataset.g, on=b.getAttribute("aria-pressed")==="true";
  if(on && state.groups.size===1) return;
  on ? state.groups.delete(g) : state.groups.add(g);
  b.setAttribute("aria-pressed", String(!on)); refresh();
}));
$("price").addEventListener("input", e => { state.max=+e.target.value; $("priceOut").textContent = state.max+" 元"; refresh(); });
$("budget").addEventListener("input", e => { state.budget=+e.target.value; $("budgetOut").textContent = state.budget+" 元"; refresh(); });
$("avoid").addEventListener("input", e => {
  state.avoid = e.target.value.split(/[,，、\s]+/).map(s=>s.trim().toLowerCase()).filter(Boolean); refresh();
});

// ── 菜單載入：優先讀同資料夾的 menu.csv（換菜單只要換這個檔），讀不到才用內建版本 ──
const CAT = {"主餐":"main","主食":"main","main course":"main","staple food":"main",
             "副餐":"side","副食":"side","side dish":"side","side meal":"side",
             "甜點":"dessert","dessert":"dessert","飲料":"drink","beverage":"drink"};
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  text = text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false } else cell+=c }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cell); cell=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cell); cell=""; if(row.some(x=>x.trim()))rows.push(row); row=[]; }
    else cell+=c;
  }
  row.push(cell); if(row.some(x=>x.trim())) rows.push(row);
  return rows;
}
function menuFromCSV(text){
  const out=[];
  for(const r of parseCSV(text)){
    if(r.length<5) continue;
    const g=CAT[(r[0]||"").trim().toLowerCase()], pm=(r[4]||"").match(/\d+/), nm=(r[1]||"").match(/\d+/);
    if(!g||!pm||!nm) continue;
    const item=(r[3]||"").replace(/\s+/g," ").trim(), price=+pm[0];
    if(item.includes("加料")||/add-on/i.test(item)||price<15) continue;
    out.push([g,+nm[0],(r[2]||"").trim(),item,price]);
  }
  return out;
}
function useMenu(list, source){
  if(!list.length) return false;
  MENU = list; $("total").textContent = MENU.length;
  $("stores").textContent = new Set(MENU.map(m=>m[1])).size;
  $("src").textContent = source;
  if(!state.busy) pickSlice();
  return true;
}
async function loadMenu(){
  try{
    const res = await fetch("menu.csv?t="+Date.now(), {cache:"no-store"});
    if(res.ok && useMenu(menuFromCSV(await res.text()), "menu.csv（同資料夾，開啟時讀取）")) return;
  }catch(e){}
  $("src").textContent = "內建菜單（找不到 menu.csv）";
}
$("csvFile").addEventListener("change", async e => {
  const f=e.target.files[0]; if(!f) return;
  const ok = useMenu(menuFromCSV(await f.text()), "你選的檔案：" + f.name);
  if(!ok) $("src").textContent = "這個檔案讀不到品項（需要 5 欄：類別、店號、店名、品名、價格）";
  e.target.value="";
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
pickSlice();
loadMenu();
$("admin").hidden = location.hash !== "#admin";   // 只有網址尾巴加 #admin 才顯示菜單來源與換檔按鈕
</script>
